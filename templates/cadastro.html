{% extends 'base.html' %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>
            Criar Conta
        </h1>

        <p class="auth-subtitle">
            Faça parte do Adote Um Desejo e ajude
            a transformar vidas. 💜
        </p>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="nome"
                placeholder="Seu nome"
                required
>

            <input
                type="text"
                name="username"
                placeholder="Usuário"
                required
            >

            <input
                type="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <button type="submit">
                Criar Conta
            </button>

        </form>

        <p class="auth-link">

            Já possui conta?

            <a href="{% url 'login' %}">
                Entrar
            </a>

        </p>

    </div>

</div>

{% endblock %}
